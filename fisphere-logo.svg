<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <!-- Background: Solid White #FFFFFF -->
  <rect width="800" height="280" fill="#FFFFFF"/>

  <!-- FiSphere Symbol: Open Architectural Interlocking Spherical Structure (Zero Gradients, Flat Vector) -->
  <g id="fisphere-symbol" transform="translate(65, 35)">
    <!-- Outer Upper-Left Structural Shell Arc (Navaera Blue #00245D) -->
    <path d="M 105 15 A 90 90 0 0 0 15 105 L 39 105 A 66 66 0 0 1 105 39 Z" fill="#00245D"/>
    
    <!-- Outer Lower-Right Structural Shell Arc (Navaera Blue #00245D) -->
    <path d="M 105 195 A 90 90 0 0 0 195 105 L 171 105 A 66 66 0 0 1 105 171 Z" fill="#00245D"/>

    <!-- Interlocking Equatorial Architectural Ribbon (Blue Gray #445772) -->
    <path d="M 22 128 C 52 156, 158 156, 188 128 L 173 112 C 148 134, 62 134, 37 112 Z" fill="#445772"/>

    <!-- Interlocking Meridian Architectural Cantilever (Green #667C4D) -->
    <path d="M 128 22 C 156 52, 156 158, 128 188 L 112 173 C 134 148, 134 62, 112 37 Z" fill="#667C4D"/>

    <!-- Inner Precision Counter-Arc Upper Right (Light Green #CFD7C7) -->
    <path d="M 105 49 A 56 56 0 0 1 161 105 L 143 105 A 38 38 0 0 0 105 67 Z" fill="#CFD7C7"/>

    <!-- Inner Precision Counter-Arc Lower Left (Primary Gray #97999B) -->
    <path d="M 49 105 A 56 56 0 0 0 105 161 L 105 143 A 38 38 0 0 1 67 105 Z" fill="#97999B"/>

    <!-- Central Core Nexus Node (Navaera Blue #00245D) -->
    <circle cx="105" cy="105" r="14" fill="#00245D"/>
  </g>

  <!-- Primary Wordmark: FiSphere (Strictly ONE continuous word, single font, single weight, single solid color #00245D) -->
  <g id="fisphere-wordmark">
    <text x="300" y="152" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-1.5" fill="#00245D">FiSphere</text>
    <!-- Endorsed Sub-brand Line: by Navaera (Navaera Logo Gray #9A9A9D) -->
    <text x="304" y="192" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="2.5" fill="#9A9A9D">by Navaera</text>
  </g>
</svg>
