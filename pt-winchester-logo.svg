<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
  <!-- Clean Solid White Background -->
  <rect width="860" height="300" fill="#FFFFFF"/>

  <!-- PT Winchester Folded Webbing Strap Symbol (Flat solid vector only: #1B4D89 Blue front, #0D6E4C Green reverse) -->
  <g id="webbing-strap-mark" transform="translate(55, 42)">
    <!-- Reverse Side Upper Fold (Solid Forest Textile Green #0D6E4C) -->
    <polygon points="36,44 128,4 166,42 74,82" fill="#0D6E4C"/>
    <!-- Woven Texture Slits on Green Upper Fold (Solid White Cutouts) -->
    <polygon points="68,36 74,33 96,55 90,58" fill="#FFFFFF"/>
    <polygon points="94,25 100,22 122,44 116,47" fill="#FFFFFF"/>

    <!-- Reverse Side Lower Fold (Solid Forest Textile Green #0D6E4C) -->
    <polygon points="74,134 166,94 204,132 112,172" fill="#0D6E4C"/>
    <!-- Woven Texture Slits on Green Lower Fold (Solid White Cutouts) -->
    <polygon points="106,126 112,123 134,145 128,148" fill="#FFFFFF"/>
    <polygon points="132,115 138,112 160,134 154,137" fill="#FFFFFF"/>

    <!-- Front Side Primary Diagonal Strap 1 (Solid Cobalt Blue #1B4D89) -->
    <polygon points="12,92 128,4 166,42 50,130" fill="#1B4D89"/>
    <!-- Edge Stitching Detail on Blue Strap 1 (Solid White) -->
    <rect x="48" y="68" width="12" height="3" transform="rotate(-37 48 68)" fill="#FFFFFF"/>
    <rect x="70" y="51" width="12" height="3" transform="rotate(-37 70 51)" fill="#FFFFFF"/>
    <rect x="92" y="34" width="12" height="3" transform="rotate(-37 92 34)" fill="#FFFFFF"/>

    <!-- Front Side Primary Diagonal Strap 2 (Solid Cobalt Blue #1B4D89) -->
    <polygon points="50,182 166,94 204,132 88,220" fill="#1B4D89"/>
    <!-- Edge Stitching Detail on Blue Strap 2 (Solid White) -->
    <rect x="86" y="158" width="12" height="3" transform="rotate(-37 86 158)" fill="#FFFFFF"/>
    <rect x="108" y="141" width="12" height="3" transform="rotate(-37 108 141)" fill="#FFFFFF"/>
    <rect x="130" y="124" width="12" height="3" transform="rotate(-37 130 124)" fill="#FFFFFF"/>

    <!-- Terminal Anchor Loop Left (Solid Forest Textile Green #0D6E4C) -->
    <polygon points="12,92 50,130 32,148 0,116" fill="#0D6E4C"/>
    <!-- Terminal Anchor Loop Right (Solid Cobalt Blue #1B4D89) -->
    <polygon points="184,68 216,100 204,132 166,94" fill="#1B4D89"/>
  </g>

  <!-- B2B Industrial Typography Lockup -->
  <g id="pt-winchester-wordmark">
    <text x="300" y="148" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.2" fill="#1B4D89">PT WINCHESTER</text>
    <!-- Solid Structural Divider Bar -->
    <rect x="303" y="168" width="84" height="6" fill="#0D6E4C"/>
    <rect x="395" y="170" width="415" height="2" fill="#1B4D89"/>
    <!-- Tagline: CONNECTING TEXTILES -->
    <text x="303" y="206" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="7.5" fill="#0D6E4C">CONNECTING TEXTILES</text>
  </g>
</svg>
