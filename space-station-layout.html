  #hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center;

  #hud a,#hud button{font:700 11px/1 'SF Mono',Menlo,monospace;letter-spacing:.1em;cursor:pointer;
    color:#02121a;background:var(--cy);border:0;border-radius:6px;padding:8px 12px;text-decoration:none;}
  #hud a.ghost{background:transparent;color:var(--cy);border:1px solid rgba(95,224,255,.5);}
  body.clean{background:#000;}
  body.clean #hud{display:none;}
  body.clean #layer-legend-overlay{display:none;}
</style></head>
