<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13634B"/>
      <stop offset="100%" stop-color="#0A382A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3C15A"/>
      <stop offset="50%" stop-color="#D99B26"/>
      <stop offset="100%" stop-color="#A87010"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#F8F7F4"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#0E4D3B" letter-spacing="2">PILLARCREST DEVELOPMENT GROUP — IDENTITY SYSTEM</text>
  <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748B" letter-spacing="2">ARCHITECTURAL REAL ESTATE DEVELOPMENT • 3 ORIGINAL VECTOR CONCEPTS &amp; LOCKUPS</text>

  <!-- CONCEPT 1: ARCHITECTURAL FLUTED PILLAR + RISING CREST SKYLINE MONOGRAM -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="320" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(160, 130)">
      <!-- Hexagonal Crest Shield -->
      <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Fluted Architectural Pillars Forming Rising Skyline + 'P' Crest -->
      <rect x="-42" y="-32" width="14" height="82" fill="#FFFFFF"/>
      <rect x="-18" y="-48" width="14" height="98" fill="#FFFFFF"/>
      <rect x="6" y="-62" width="14" height="112" fill="url(#goldGrad)"/>
      <!-- Rising P Arch & Roofline Crest -->
      <path d="M -42,-32 L 6,-62 L 46,-38 L 46,-2 L 6,16 L 6,2 L 32,-10 L 32,-30 L 6,-46 L -42,-18 Z" fill="url(#goldGrad)"/>
    </g>
    <text x="160" y="272" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0E4D3B" text-anchor="middle" letter-spacing="3">PILLARCREST</text>
    <text x="160" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#D99B26" text-anchor="middle" letter-spacing="3.5">DEVELOPMENT GROUP</text>
    <text x="160" y="334" font-family="Helvetica, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Concept 01 • Fluted Pillar &amp; Skyline Crest</text>
  </g>

  <!-- CONCEPT 2: INTERLOCKING ISOMETRIC 'P' STRUCTURAL TOWER -->
  <g transform="translate(440, 140)">
    <rect x="0" y="0" width="320" height="360" rx="12" fill="#0E4D3B" stroke="#D99B26" stroke-width="2"/>
    <g transform="translate(160, 130)">
      <!-- Left Isometric Pillar Column -->
      <polygon points="-44,-45 -12,-64 -12,68 -44,49" fill="#FFFFFF"/>
      <polygon points="-12,-64 16,-48 16,52 -12,68" fill="#CBD5E1"/>
      <!-- Golden Isometric Cantilever Crest Forming 'P' -->
      <polygon points="-12,-64 52,-28 52,14 16,34 16,2 24,-2 24,-14 -12,-35" fill="url(#goldGrad)"/>
      <polygon points="-44,-45 -12,-64 52,-28 20,-10" fill="#F3C15A"/>
    </g>
    <text x="160" y="272" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">PILLARCREST</text>
    <text x="160" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#F3C15A" text-anchor="middle" letter-spacing="3.5">DEVELOPMENT GROUP</text>
    <text x="160" y="334" font-family="Helvetica, sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">Concept 02 • Isometric Structural 'P' Monolith</text>
  </g>

  <!-- CONCEPT 3: MINIMALIST KEYSTONE & GOLDEN HORIZON CREST -->
  <g transform="translate(800, 140)">
    <rect x="0" y="0" width="320" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(160, 130)">
      <!-- Classical Pediment Crest + 3 Columns -->
      <path d="M -68,-22 L 0,-68 L 68,-22 L 54,-12 L 0,-48 L -54,-12 Z" fill="url(#goldGrad)"/>
      <rect x="-46" y="-8" width="18" height="66" rx="2" fill="#0E4D3B"/>
      <rect x="-9" y="-22" width="18" height="80" rx="2" fill="#0E4D3B"/>
      <rect x="28" y="-8" width="18" height="66" rx="2" fill="#0E4D3B"/>
      <rect x="-62" y="64" width="124" height="8" rx="2" fill="url(#goldGrad)"/>
    </g>
    <text x="160" y="272" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle" letter-spacing="3">PILLARCREST</text>
    <text x="160" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0E4D3B" text-anchor="middle" letter-spacing="3.5">DEVELOPMENT GROUP</text>
    <text x="160" y="334" font-family="Helvetica, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Concept 03 • Classical Keystone &amp; Horizon</text>
  </g>
</svg>
