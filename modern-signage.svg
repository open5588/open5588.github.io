<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0B0F17" rx="18"/>
  <!-- Left: Illuminated Exterior Storefront Sign Blueprint -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="440" height="420" rx="12" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="20" y="30" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#38BDF8" letter-spacing="1.5">EXTERIOR STOREFRONT SIGN // 3600 × 900 MM</text>
    <!-- Main Aluminum Cabinet + Halo-Lit 3D Acrylic Letters -->
    <rect x="30" y="75" width="380" height="135" rx="8" fill="#090D14" stroke="#D4AF37" stroke-width="3"/>
    <polygon points="75,112 108,95 141,112 141,148 108,165 75,148" fill="none" stroke="#D4AF37" stroke-width="3.5"/>
    <path d="M92,144 L108,110 L124,144 M97,134 L119,134" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="165" y="138" font-family="'Inter', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="4">AURELIA</text>
    <text x="165" y="160" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#D4AF37" letter-spacing="5.5">COMMERCIAL GROUP</text>
    <!-- Dimension Callouts -->
    <line x1="30" y1="230" x2="410" y2="230" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="220" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#38BDF8">← 3,600 mm (141.7 in) OVERALL WIDTH →</text>
    <!-- Specs Table -->
    <rect x="30" y="270" width="380" height="120" rx="8" fill="#0B0F17" stroke="#1E293B"/>
    <text x="46" y="296" font-family="monospace" font-size="11" fill="#E2E8F0">• FACE: 3mm Matte Obsidian Aluminum Composite (RAL 9005)</text>
    <text x="46" y="318" font-family="monospace" font-size="11" fill="#E2E8F0">• LETTERS: 25mm Push-Through Opal Acrylic + Brushed Brass</text>
    <text x="46" y="340" font-family="monospace" font-size="11" fill="#E2E8F0">• ILLUMINATION: 4000K Warm-White IP67 LED Halo Backlight</text>
    <text x="46" y="362" font-family="monospace" font-size="11" fill="#D4AF37">• PANTONE: PMS 871 C (Metallic Gold) + PMS Black 6 C</text>
  </g>
  <!-- Right: Matching A4 Corporate Letterhead -->
  <g transform="translate(500, 40)">
    <rect x="0" y="0" width="270" height="420" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="12" fill="#0F172A"/>
    <rect x="0" y="12" width="270" height="4" fill="#D4AF37"/>
    <polygon points="36,36 50,28 64,36 64,52 50,60 36,52" fill="#0F172A" stroke="#D4AF37" stroke-width="2"/>
    <text x="76" y="45" font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#0F172A" letter-spacing="2.5">AURELIA</text>
    <text x="76" y="57" font-family="'Inter', sans-serif" font-weight="700" font-size="7.5" fill="#B48A28" letter-spacing="3">COMMERCIAL GROUP</text>
    <line x1="28" y1="74" x2="242" y2="74" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="28" y="395" width="214" height="12" rx="2" fill="#0F172A"/>
  </g>
</svg>
